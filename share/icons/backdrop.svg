<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>backdrop</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262b6e"/>
      <stop offset="1" stop-color="#120f33"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4bd6"/>
      <stop offset="0.55" stop-color="#e2558f"/>
      <stop offset="1" stop-color="#ffa36b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="1" stop-color="#ffc35c"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb4ff"/>
      <stop offset="1" stop-color="#4f6cf0"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="28" y="78" width="178" height="136" rx="20"/>
    </clipPath>
  </defs>

  <!-- The tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- The layer behind: the backdrop -->
  <rect x="54" y="42" width="178" height="136" rx="20" fill="url(#layer)" opacity="0.8"/>

  <!-- The screen in front: a wallpaper at dusk -->
  <g clip-path="url(#screen)">
    <rect x="28" y="78" width="178" height="136" fill="url(#sky)"/>
    <circle cx="142" cy="150" r="36" fill="url(#sun)"/>
    <path d="M28 182 L84 128 L118 160 L146 138 L206 186 L206 214 L28 214 Z" fill="#3b2a7a"/>
    <path d="M28 200 L72 170 L112 192 L160 162 L206 192 L206 214 L28 214 Z" fill="#1d1546"/>
  </g>
  <rect x="28" y="78" width="178" height="136" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
</svg>
