# Example backdrop configuration
# Copy to ~/.config/backdrop/config.yaml; anything left out uses the default.

sources:
  pexels:
    api_key: "your-pexels-api-key"   # or set PEXELS_API (https://www.pexels.com/api/)
    per_page: 80                     # 15-80
    image_min_size: large            # large, medium, small

library:
  import_dirs:                       # already-approved local wallpapers
    - ~/Pictures/wallpapers
    - ~/Videos/live-wallpapers
  default_import_rating: 2           # 1-3, editable later while viewing
  min_width: 1024                    # smaller files are not imported (either orientation)
  min_height: 768
  trash_days: 30                     # purge skipped files after this many days; 0 disables

display:
  monitors: auto                     # or a list of xrandr output names, e.g. [DP-1, HDMI-1]
  image_duration: 300                # seconds per image
  video_duration: 600                # play a video about this long before the next; 0 loops forever
  order: random                      # next/skip/keep --next pick at random; shuffle plays the shuffled order
  notify: commands                   # desktop notification on media changes: commands, all (every load) or off
  allow_upscale: false               # never show media smaller than the monitor
  mpv_args: [--hwdec=vaapi]          # extra mpv options (your mpv.conf is not loaded)

menu:
  style: panel                       # panel (preview banner and buttons) or minimal (a list)
  rofi_args: []                      # extra rofi options for backdrop menu, e.g. [-theme, ~/.config/rofi/backdrop.rasi]
  workspace: true                    # i3: show an empty workspace ("backdrop", or a name given here) while the menu is open; false to stay

visualizer:
  enabled: false                     # run a GLava music visualizer above the wallpaper (needs glava and a compositor)
  monitors: all                      # all, a list [DP-3], or a mapping with per-monitor placement/rect: {DP-3: {placement: {anchor: top}}}
  module: bars                       # bars, graph, radial, circle or wave
  audio: pulseaudio                  # or fifo (source then defaults to /tmp/mpd.fifo)
  source: auto                       # pulseaudio sink or device, or the fifo path
  opacity: 0.8                       # whole visualizer over the wallpaper, 0 to 1 (bar color alpha blends the bars too)
  placement: {anchor: bottom, width: 100%, height: 25%, margin: 0}  # anchor: bottom, top, left, right, center, fill
  # rect: {x: 0, y: 75%, width: 100%, height: 25%}  # overrides placement; pixels or % of the monitor
  bars: {width: 20, gap: 1, outline: 0, amplify: 200, colors: ['#000000', '#33aacc'], gradient: 80, direction: inward, flip: false}
  defines: {}                        # raw GLava #defines for the module, e.g. {C_LINE: 2}; override the bars options
  requests: []                       # raw GLava requests, e.g. ['setframerate 60']
  glava: {shader_dir: /etc/xdg/glava, args: []}

screensaver:
  idle_minutes: 10
  sources: [rated_videos]
  streams:
    - https://www.youtube.com/watch?v=example

output:
  symbols: auto                      # auto, nerd, unicode or ascii (Nerd Fonts must be chosen explicitly)
  progress_gradient: ['#00c8ff', '#a050ff']

# Every path defaults to an XDG location; override individually if needed.
# paths:
#   database: ~/.local/share/backdrop/backdrop.db
#   logfile: ~/.local/share/backdrop/backdrop.log
#   media: ~/.local/share/backdrop/media
#   trash: ~/.local/share/backdrop/trash
#   inbox: ~/.cache/backdrop/inbox
#   runtime: $XDG_RUNTIME_DIR/backdrop
